# MarketLens — nginx reverse proxy config (production placeholder)
#
# Henüz aktif değil. Adım 22 / production deploy döneminde aşağıdakiler eklenecek:
#   - SSL termination (Let's Encrypt / Cloudflare origin cert)
#   - HTTP/2
#   - Rate limiting (ek, FastAPI slowapi'nin üstünde)
#   - WebSocket proxy (/ws)
#   - Static asset cache headers
#   - gzip/brotli
#
# Şu anki içerik sadece "dosya var" demek için. docker-compose.prod.yml bunu mount edecek.

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # TODO Adım 22:
    # upstream backend { server backend:8000; }
    # upstream frontend { server frontend:5173; }
    #
    # server {
    #     listen 80;
    #     server_name marketlens.yourdomain.com;
    #
    #     location /api/ { proxy_pass http://backend; }
    #     location /ws   { proxy_pass http://backend; ... }
    #     location /     { proxy_pass http://frontend; }
    # }

    server {
        listen 80 default_server;
        server_name _;
        return 200 "MarketLens nginx placeholder — production'da yapılandırılacak\n";
        add_header Content-Type text/plain;
    }
}
