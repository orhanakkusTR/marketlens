[project]
name = "marketlens-backend"
version = "0.1.0"
description = "MarketLens — kişisel kripto + emtia karar destek terminali (backend)"
# Python 3.12+: yeni pandas-ta (numpy 2.x üstü) Python 3.12 minimum istiyor
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Johnson", email = "orhanakkustr@gmail.com" },
]

# Faz 1 baseline. Faz 2-4 bağımlılıkları (coinglass, anthropic vs.) ilgili adımlarda eklenecek.
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",

    # Validation & settings
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",

    # Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # Cache / queue
    "redis>=5.2.0",
    "celery>=5.4.0",

    # HTTP & resilience
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "pybreaker>=1.2.0",
    "slowapi>=0.1.9",

    # Logging
    "structlog>=24.4.0",

    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.1",  # passlib uyumluluk için

    # Data / indicators
    # pandas 2.2+ ve numpy 2.x ile uyumlu pandas-ta sürümü kullanılıyor
    "pandas>=2.2.3",
    "numpy>=2.2.6",
    "pandas-ta>=0.3.14b0",

    # External data clients
    "python-binance>=1.0.27",
    "yfinance>=0.2.50",

    # Telegram
    "python-telegram-bot>=21.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "factory-boy>=3.3.1",
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
# Dev grubu varsayılan olarak kuruluyor
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: gerçek dış API kullanan testler (yavaş)",
    "slow: yavaş çalışan testler",
]
